[pyprland]
plugins = ["scratchpads"]
hyprland_version = "0.54.0"

[scratchpads.yazi]
animation = ""
command = "kitty --class kitty-yazi yazi"
class = "kitty-yazi"
lazy = true
unfocus = "hide"
margin = 60
position = "25% 10%"
size = "50% 80%"
match_by = "class"

# Uno yazi per workspace (Super+A); "yazi" resta quello globale (Super+Shift+A)
[scratchpads.yazi-1]
use = "yazi"
command = "kitty --class kitty-yazi-1 yazi"
class = "kitty-yazi-1"

[scratchpads.yazi-2]
use = "yazi"
command = "kitty --class kitty-yazi-2 yazi"
class = "kitty-yazi-2"

[scratchpads.yazi-3]
use = "yazi"
command = "kitty --class kitty-yazi-3 yazi"
class = "kitty-yazi-3"

[scratchpads.yazi-4]
use = "yazi"
command = "kitty --class kitty-yazi-4 yazi"
class = "kitty-yazi-4"

[scratchpads.yazi-5]
use = "yazi"
command = "kitty --class kitty-yazi-5 yazi"
class = "kitty-yazi-5"

[scratchpads.yazi-6]
use = "yazi"
command = "kitty --class kitty-yazi-6 yazi"
class = "kitty-yazi-6"

[scratchpads.yazi-7]
use = "yazi"
command = "kitty --class kitty-yazi-7 yazi"
class = "kitty-yazi-7"

[scratchpads.yazi-8]
use = "yazi"
command = "kitty --class kitty-yazi-8 yazi"
class = "kitty-yazi-8"

[scratchpads.yazi-9]
use = "yazi"
command = "kitty --class kitty-yazi-9 yazi"
class = "kitty-yazi-9"

[scratchpads.yazi-10]
use = "yazi"
command = "kitty --class kitty-yazi-10 yazi"
class = "kitty-yazi-10"

[scratchpads.term]
animation = ""
command = "kitty --class kitty-term"
class = "kitty-term"
lazy = true
unfocus = "hide"
margin = 60
position = "25% 5%"
size = "50% 55%"

[scratchpads.editor]
animation = ""
command = "emacs --name editor"
class = "editor"
lazy = true
unfocus = "hide"
margin = 60
position = "25% 10%"
size = "50% 80%"

[scratchpads.qalc]
animation = ""
command = "kitty --class kitty-qalc qalc"
class = "kitty-qalc"
lazy = true
unfocus = "hide"
margin = 60
position = "25% 70%"
size = "50% 25%"

[scratchpads.ebuku]
animation = ""
command = """kitty --class emacs-ebuku --hold emacsclient -t --eval '(ebuku)'"""
class = "emacs-ebuku"
lazy = true
unfocus = "hide"
margin = 60
position = "25% 25%"
size = "50% 50%"

[scratchpads.qutebrowser]
animation = ""
command = """qutebrowser"""
class = "org.qutebrowser.qutebrowser"
lazy = true
unfocus = "hide"
margin = 60
position = "25% 25%"
size = "50% 50%"
